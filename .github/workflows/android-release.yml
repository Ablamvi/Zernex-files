name: ZERNEX Files 1.1.0 - Android validation

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: zernex-files-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint distribution variants
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source and release rules
        run: python3 tools/verify_source.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Prepare optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ZERNEX_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ZERNEX_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZERNEX_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZERNEX_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            KEYSTORE_FILE="$RUNNER_TEMP/zernex-files-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            test -s "$KEYSTORE_FILE"
            keytool -list -keystore "$KEYSTORE_FILE" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
            {
              echo "ZERNEX_KEYSTORE_FILE=$KEYSTORE_FILE"
              echo "ZERNEX_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ZERNEX_KEY_ALIAS=$KEY_ALIAS"
              echo "ZERNEX_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "No release keystore configured; release APKs will be unsigned."
          fi

      - name: Run Play lint and build both release APKs
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:testPlayDebugUnitTest \
            :app:lintPlayRelease \
            :app:assemblePlayRelease \
            :app:assembleAndroid10LegacyRelease

      - name: Upload unit test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZERNEX-Files-1.1.0-test-reports
          path: |
            app/build/reports/tests/testPlayDebugUnitTest/
            app/build/test-results/testPlayDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Play APK
        uses: actions/upload-artifact@v4
        with:
          name: ZERNEX-Files-1.1.0-Play
          path: app/build/outputs/apk/play/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android 10 legacy APK
        uses: actions/upload-artifact@v4
        with:
          name: ZERNEX-Files-1.1.0-Android10-Legacy
          path: app/build/outputs/apk/android10Legacy/release/*.apk
          if-no-files-found: error
          retention-days: 30
